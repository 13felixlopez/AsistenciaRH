[build]
  base = "cerocosto"
  publish = "frontend"
  functions = "netlify/functions"

# Redirección de llamadas a la API hacia la función serverless de Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Redirige la raíz principal al inicio de sesión
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
