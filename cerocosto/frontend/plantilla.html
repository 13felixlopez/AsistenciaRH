<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Personal Contratado | Registro de Asistencia</title>
    <!-- Metadatos PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#860063">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-light">
    <div class="app-wrapper d-flex">
        <!-- Sidebar Navigation -->
        <aside id="sidebarMenu"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper flex-grow-1 d-flex flex-column min-vh-100 overflow-hidden">
            <!-- Navbar -->
            <nav id="appNavbar"></nav>

            <!-- Main Body -->
            <main class="flex-grow-1 p-3 p-md-4 overflow-auto">
                <div class="container-fluid p-0">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                        <div>
                            <h2 class="fw-bold mb-1 text-dark d-flex align-items-center gap-2">
                                <i class="bi bi-people-fill text-primary"></i>
                                <span>Plantilla de Personal Contratado</span>
                            </h2>
                            <p class="text-muted mb-0">Define la cantidad autorizada de personal por cargo para tus áreas asignadas. Esta cifra fijará el límite estricto de asistencia y alimentará los reportes reales sin inventar números.</p>
                        </div>
                    </div>

                    <!-- Selector de Área -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body p-3">
                            <div class="row g-2 align-items-center">
                                <div class="col-auto">
                                    <label for="selectAreaPlantilla" class="col-form-label fw-semibold text-secondary">
                                        <i class="bi bi-diagram-3-fill text-primary me-1"></i> Seleccionar Área:
                                    </label>
                                </div>
                                <div class="col-12 col-sm-6 col-md-4">
                                    <select id="selectAreaPlantilla" class="form-select">
                                        <option value="">Cargando áreas autorizadas...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Contenedor Principal de la Plantilla -->
                    <div id="plantillaContainer">
                        <div class="card shadow-sm border-0 py-5 text-center text-muted">
                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                            Cargando información de plantilla...
                        </div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer id="appFooter"></footer>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle & App Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initAppLayout('plantilla');

            const selectArea = document.getElementById('selectAreaPlantilla');
            const container = document.getElementById('plantillaContainer');
            let currentAreaId = null;

            async function cargarPlantilla(areaId = null) {
                try {
                    let endpoint = '/puestos/plantilla';
                    if (areaId) endpoint += `?areaId=${areaId}`;

                    const res = await api.get(endpoint);
                    if (!res.success) {
                        showToast('error', res.message || 'Error al cargar plantilla');
                        return;
                    }

                    const areas = res.areas || [];
                    currentAreaId = res.selectedAreaId;

                    if (areas.length > 0) {
                        selectArea.innerHTML = areas.map(a => `
                            <option value="${a.id_area}" ${res.selectedAreaId === a.id_area ? 'selected' : ''}>
                                ${a.nombre} (${a.codigo})
                            </option>
                        `).join('');
                    } else {
                        selectArea.innerHTML = '<option value="">-- No tienes áreas asignadas --</option>';
                    }

                    renderContent(res);
                } catch (err) {
                    console.error('Error cargando plantilla:', err);
                    container.innerHTML = `
                        <div class="card shadow-sm border-0 py-5 text-center text-danger">
                            <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
                            <h5 class="fw-bold">Error de conexión</h5>
                            <p class="small text-muted mb-0">${err.message}</p>
                        </div>
                    `;
                }
            }

            function renderContent(data) {
                const area = data.areaSeleccionada;
                const puestos = data.puestos || [];
                const totalContratados = data.totalContratados || 0;

                if (!area) {
                    container.innerHTML = `
                        <div class="card shadow-sm border-0 py-5 text-center text-muted">
                            <i class="bi bi-diagram-3 fs-1 text-secondary mb-2"></i>
                            <h5 class="fw-bold text-dark">Selecciona un Área</h5>
                            <p class="small text-muted mb-0">Elige un área del catálogo superior para ver y editar su personal contratado.</p>
                        </div>
                    `;
                    return;
                }

                if (puestos.length === 0) {
                    container.innerHTML = `
                        <div class="card shadow-sm border-0 py-5 text-center text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                            No hay puestos activos registrados en ${area.nombre}.
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <form id="formGuardarPlantilla">
                        <div class="card shadow-sm border-0 mb-5">
                            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <div>
                                    <h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                                        <i class="bi bi-building text-primary"></i>
                                        <span>${area.nombre}</span>
                                        <span class="badge bg-light text-muted border small">${area.codigo}</span>
                                    </h5>
                                    <small class="text-muted">${puestos.length} cargos o puestos en esta área</small>
                                </div>
                                <div class="bg-primary-subtle border border-primary-subtle rounded-3 px-3 py-2 text-center shadow-sm">
                                    <small class="text-primary fw-semibold d-block" style="font-size: 0.72rem;">TOTAL PERSONAL CONTRATADO</small>
                                    <span class="fs-4 fw-bold text-primary" id="displayTotalPlantilla">${totalContratados}</span>
                                    <small class="text-muted d-block" style="font-size: 0.7rem;">personas autorizadas</small>
                                </div>
                            </div>

                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th class="ps-4" style="width: 45%;">Puesto / Cargo</th>
                                                <th style="width: 25%;">Modalidad de Turnos</th>
                                                <th class="pe-4 text-center" style="width: 30%;">Personal Contratado / Autorizado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${puestos.map(p => `
                                                <tr>
                                                    <td class="ps-4">
                                                        <div class="fw-bold text-dark fs-6">${p.nombre}</div>
                                                        ${p.descripcion ? `<small class="text-muted d-block" style="font-size: 0.75rem;">${p.descripcion}</small>` : ''}
                                                    </td>
                                                    <td>
                                                        ${p.aplica_turnos ? `
                                                            <span class="badge bg-warning-subtle text-dark border border-warning-subtle">
                                                                <i class="bi bi-clock-history me-1 text-warning"></i> 2 Turnos (Día / Noche)
                                                            </span>
                                                        ` : `
                                                            <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                                                                Turno Único
                                                            </span>
                                                        `}
                                                    </td>
                                                    <td class="pe-4 text-center">
                                                        <div class="input-group input-group-sm mx-auto" style="max-width: 170px;">
                                                            <button type="button" class="btn btn-outline-secondary btn-step-down" data-id="${p.id_puesto}">
                                                                <i class="bi bi-dash"></i>
                                                            </button>
                                                            <input type="number" 
                                                                   class="form-control text-center fw-bold fs-6 input-plantilla" 
                                                                   id="cant_puesto_${p.id_puesto}"
                                                                   data-id="${p.id_puesto}"
                                                                   value="${p.cantidad_contratada || 0}" 
                                                                   min="0" 
                                                                   max="500" 
                                                                   step="1"
                                                                   required>
                                                            <button type="button" class="btn btn-outline-secondary btn-step-up" data-id="${p.id_puesto}">
                                                                <i class="bi bi-plus"></i>
                                                            </button>
                                                        </div>
                                                        <small class="text-muted d-block mt-1" style="font-size: 0.7rem;">tope máximo en asistencia</small>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>

                                <div class="card-footer bg-white p-3 p-md-4 border-top d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                                    <div class="text-muted small">
                                        <i class="bi bi-shield-check text-success me-1"></i>
                                        Al guardar, el sistema no permitirá registrar una asistencia mayor a la cantidad contratada especificada para cada cargo.
                                    </div>
                                    <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm d-flex align-items-center gap-2" id="btnGuardarPlantilla">
                                        <i class="bi bi-save-fill"></i>
                                        <span>Guardar Plantilla de ${area.nombre}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                `;

                // Recalcular totales en tiempo real
                const inputsPlantilla = container.querySelectorAll('.input-plantilla');
                const displayTotal = document.getElementById('displayTotalPlantilla');

                function recalcular() {
                    let sum = 0;
                    inputsPlantilla.forEach(inp => {
                        const val = parseInt(inp.value, 10);
                        if (!isNaN(val) && val > 0) sum += val;
                    });
                    if (displayTotal) displayTotal.textContent = sum;
                }

                inputsPlantilla.forEach(inp => inp.addEventListener('input', recalcular));

                container.querySelectorAll('.btn-step-up').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const pId = btn.getAttribute('data-id');
                        const inp = document.getElementById(`cant_puesto_${pId}`);
                        if (inp) {
                            inp.value = (parseInt(inp.value, 10) || 0) + 1;
                            recalcular();
                        }
                    });
                });

                container.querySelectorAll('.btn-step-down').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const pId = btn.getAttribute('data-id');
                        const inp = document.getElementById(`cant_puesto_${pId}`);
                        if (inp) {
                            const cur = parseInt(inp.value, 10) || 0;
                            if (cur > 0) {
                                inp.value = cur - 1;
                                recalcular();
                            }
                        }
                    });
                });

                // Enviar formulario
                document.getElementById('formGuardarPlantilla').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btnGuardarPlantilla');
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';

                    const puestosPayload = [];
                    inputsPlantilla.forEach(inp => {
                        puestosPayload.push({
                            id_puesto: parseInt(inp.getAttribute('data-id'), 10),
                            cantidad_contratada: Math.max(0, parseInt(inp.value, 10) || 0)
                        });
                    });

                    try {
                        const saveRes = await api.post('/puestos/plantilla/guardar', {
                            id_area: currentAreaId,
                            puestos: puestosPayload
                        });

                        if (saveRes.success) {
                            Swal.fire({
                                title: '¡Plantilla Guardada!',
                                text: saveRes.message,
                                icon: 'success',
                                confirmButtonColor: '#860063'
                            });
                            cargarPlantilla(currentAreaId);
                        } else {
                            throw new Error(saveRes.message || 'Error al guardar');
                        }
                    } catch (err) {
                        Swal.fire('Error', err.message, 'error');
                        btn.disabled = false;
                        btn.innerHTML = `<i class="bi bi-save-fill me-1"></i> Guardar Plantilla de ${area.nombre}`;
                    }
                });
            }

            selectArea.addEventListener('change', () => {
                const val = selectArea.value ? parseInt(selectArea.value, 10) : null;
                if (val) cargarPlantilla(val);
            });

            cargarPlantilla();
        });
    </script>
</body>
</html>
