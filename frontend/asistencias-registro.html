<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Diaria | Registro de Asistencia</title>
    <!-- Metadatos PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#860063">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-light">
    <div class="app-wrapper d-flex">
        <!-- Sidebar Navigation -->
        <aside id="sidebarMenu"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper flex-grow-1 d-flex flex-column min-vh-100 overflow-hidden">
            <!-- Navbar -->
            <nav id="appNavbar"></nav>

            <!-- Main Body -->
            <main class="flex-grow-1 p-3 p-md-4 overflow-auto">
                <div class="container-fluid p-0">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                        <div>
                            <h2 class="fw-bold mb-1 text-dark fs-4 fs-md-2">Registro Diario de Asistencia</h2>
                            <p class="text-muted mb-0 small">Captura la cantidad de personal asistente por puesto en el área y ubicación seleccionada.</p>
                        </div>
                        <div class="d-none d-sm-block">
                            <a href="/asistencias-historial.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
                                <i class="bi bi-clock-history"></i>
                                <span>Ver Historial</span>
                            </a>
                        </div>
                    </div>

                    <!-- Selector de Fecha, Área y Ubicación -->
                    <div class="card shadow-sm border-0 mb-3">
                        <div class="card-body p-3 p-md-4">
                            <form id="formSeleccionJornada" class="row g-2 g-md-3 align-items-end">
                                <!-- Fecha -->
                                <div class="col-12 col-sm-6 col-md-3">
                                    <label for="fecha" class="form-label fw-semibold text-secondary small mb-1">
                                        <i class="bi bi-calendar-check me-1 text-primary"></i> Fecha:
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-primary">
                                            <i class="bi bi-calendar3"></i>
                                        </span>
                                        <input type="date" 
                                               class="form-control form-control-lg fs-6 border-start-0 bg-light" 
                                               id="fechaInput" 
                                               readonly 
                                               tabindex="-1">
                                    </div>
                                </div>

                                <!-- Área Operativa -->
                                <div class="col-12 col-sm-6" id="colAreaWrapper">
                                    <label for="selectArea" class="form-label fw-semibold text-secondary small mb-1">
                                        <i class="bi bi-building me-1 text-primary"></i> Área Operativa:
                                    </label>
                                    <select id="selectArea" class="form-select form-select-lg fs-6" required>
                                        <option value="">-- Seleccione un Área --</option>
                                    </select>
                                </div>

                                <!-- Selector de Ubicación (dinámico) -->
                                <div class="col-12 col-sm-6 col-md-3 d-none" id="colUbicacionWrapper">
                                    <label for="selectUbicacion" class="form-label fw-semibold text-secondary small mb-1">
                                        <i class="bi bi-geo-alt-fill me-1 text-warning"></i> Ubicación / Línea:
                                    </label>
                                    <select id="selectUbicacion" class="form-select form-select-lg fs-6 border-warning">
                                        <option value="">-- Seleccionar Ubicación --</option>
                                    </select>
                                </div>

                                <!-- Botón Cargar -->
                                <div class="col-12 col-md-2" id="colBtnCargar">
                                    <button type="button" id="btnCargarJornada" class="btn btn-primary btn-lg w-100 fw-semibold fs-6 d-flex align-items-center justify-content-center gap-2 py-2">
                                        <i class="bi bi-arrow-repeat"></i>
                                        <span>Cargar</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Contenedor Dinámico de Puestos y Captura -->
                    <div id="captureContainer">
                        <div class="card shadow-sm border-0 py-5 text-center text-muted">
                            <i class="bi bi-building-check fs-1 text-secondary mb-2"></i>
                            <h5 class="fw-bold text-dark">Selecciona un Área para Comenzar</h5>
                            <p class="small text-muted mb-0">Elige una de tus áreas asignadas en el selector superior para capturar la asistencia del día.</p>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer id="appFooter"></footer>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle & App Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initAppLayout('registro');

            const urlParams = new URLSearchParams(window.location.search);
            let currentAreaId = urlParams.get('areaId') ? parseInt(urlParams.get('areaId'), 10) : null;
            let currentUbicacionId = urlParams.get('ubicacionId') ? parseInt(urlParams.get('ubicacionId'), 10) : null;

            const selectArea = document.getElementById('selectArea');
            const selectUbicacion = document.getElementById('selectUbicacion');
            const colUbicacionWrapper = document.getElementById('colUbicacionWrapper');
            const colAreaWrapper = document.getElementById('colAreaWrapper');
            const fechaInput = document.getElementById('fechaInput');
            const captureContainer = document.getElementById('captureContainer');
            const btnCargarJornada = document.getElementById('btnCargarJornada');

            // Cargar datos del formulario
            async function loadJornadaData() {
                try {
                    let endpoint = '/asistencias/registro';
                    const params = [];
                    if (currentAreaId) params.push(`areaId=${currentAreaId}`);
                    if (currentUbicacionId) params.push(`ubicacionId=${currentUbicacionId}`);
                    if (params.length > 0) endpoint += '?' + params.join('&');

                    const res = await api.get(endpoint);
                    if (!res.success || !res.data) return;

                    const data = res.data;
                    fechaInput.value = data.hoy;

                    // Poblar áreas asignadas
                    const areasList = data.areas || [];
                    if (areasList.length === 1) {
                        selectArea.innerHTML = areasList.map(a => `
                            <option value="${a.id_area}" selected>
                                ${a.nombre} (${a.codigo})
                            </option>
                        `).join('');
                        if (!currentAreaId) {
                            currentAreaId = areasList[0].id_area;
                        }
                    } else if (areasList.length > 1) {
                        selectArea.innerHTML = '<option value="">-- Seleccione un Área --</option>' + 
                            areasList.map(a => `
                                <option value="${a.id_area}" ${data.selectedAreaId === a.id_area ? 'selected' : ''}>
                                    ${a.nombre} (${a.codigo})
                                </option>
                            `).join('');
                    } else {
                        selectArea.innerHTML = '<option value="">-- No tienes áreas autorizadas para capturar --</option>';
                    }

                    // Ubicaciones
                    if (data.ubicacionesDisponibles && data.ubicacionesDisponibles.length > 0) {
                        colUbicacionWrapper.classList.remove('d-none');
                        colAreaWrapper.className = 'col-12 col-sm-6 col-md-4';
                        selectUbicacion.required = true;
                        selectUbicacion.innerHTML = '<option value="">-- Seleccionar Ubicación --</option>' + 
                            data.ubicacionesDisponibles.map(u => `
                                <option value="${u.id_ubicacion}" ${data.selectedUbicacionId === u.id_ubicacion ? 'selected' : ''}>
                                    ${u.nombre}
                                </option>
                            `).join('');
                    } else {
                        colUbicacionWrapper.classList.add('d-none');
                        colAreaWrapper.className = 'col-12 col-sm-6 col-md-7';
                        selectUbicacion.required = false;
                    }

                    // Renderizar contenedor de puestos
                    renderCaptureContent(data);
                } catch (err) {
                    console.error('Error cargando jornada:', err);
                    showToast('error', 'Error al cargar datos del área');
                }
            }

            function renderCaptureContent(data) {
                if (!data.selectedAreaId || !data.areaSeleccionadaInfo) {
                    captureContainer.innerHTML = `
                        <div class="card shadow-sm border-0 py-5 text-center text-muted">
                            <i class="bi bi-building-check fs-1 text-secondary mb-2"></i>
                            <h5 class="fw-bold text-dark">Selecciona un Área para Comenzar</h5>
                            <p class="small text-muted mb-0">Elige una de tus áreas asignadas en el selector superior para capturar la asistencia del día.</p>
                        </div>
                    `;
                    return;
                }

                // Si requiere ubicación y no está seleccionada
                if (data.ubicacionesDisponibles && data.ubicacionesDisponibles.length > 0 && !data.selectedUbicacionId) {
                    captureContainer.innerHTML = `
                        <div class="card shadow-sm border-warning border-2 p-4 text-center my-4 bg-light">
                            <div class="mx-auto mb-2 text-warning fs-1">
                                <i class="bi bi-geo-alt"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">Selecciona una Ubicación para ${data.areaSeleccionadaInfo.nombre}</h5>
                            <p class="text-muted small mb-3">Esta área cuenta con distintas ubicaciones autorizadas (ej. Arábiga, Robusta o Patios). Elige en el selector superior o haz clic abajo:</p>
                            <div class="d-flex justify-content-center gap-2 flex-wrap">
                                ${data.ubicacionesDisponibles.map(u => `
                                    <button type="button" class="btn btn-outline-warning text-dark fw-semibold shadow-sm btn-select-ubicacion-direct" data-id="${u.id_ubicacion}">
                                        <i class="bi bi-geo-alt-fill text-warning me-1"></i> ${u.nombre}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    document.querySelectorAll('.btn-select-ubicacion-direct').forEach(b => {
                        b.addEventListener('click', () => {
                            currentUbicacionId = parseInt(b.getAttribute('data-id'), 10);
                            loadJornadaData();
                        });
                    });
                    return;
                }

                // Renderizar tabla de puestos
                const puestos = data.puestos || [];
                const ubicacionTitle = data.ubicacionSeleccionadaInfo 
                    ? `<span class="badge bg-warning text-dark border border-warning px-3 py-1 fs-6"><i class="bi bi-geo-alt-fill me-1"></i> ${data.ubicacionSeleccionadaInfo.nombre}</span>` 
                    : '';

                const adminBadge = data.isAdmin 
                    ? `<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1 small"><i class="bi bi-shield-lock-fill me-1"></i> Admin: Edición Habilitada</span>` 
                    : '';

                if (puestos.length === 0) {
                    captureContainer.innerHTML = `
                        <div class="card shadow-sm border-0 mb-5 p-5 text-center text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                            No hay puestos activos registrados en esta área.
                        </div>
                    `;
                    return;
                }

                captureContainer.innerHTML = `
                    <div class="card shadow-sm border-0 mb-5">
                        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div>
                                <h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2 flex-wrap">
                                    <i class="bi bi-diagram-3-fill text-primary"></i> 
                                    <span>${data.areaSeleccionadaInfo.nombre}</span>
                                    ${ubicacionTitle}
                                </h5>
                                <small class="text-muted">
                                    Fecha: <strong>${data.selectedDate}</strong> | ${puestos.length} puestos/turnos disponibles
                                </small>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                ${adminBadge}
                                <div class="bg-primary-subtle border border-primary-subtle rounded-3 px-3 py-1 text-center shadow-sm">
                                    <small class="text-primary fw-semibold d-block" style="font-size: 0.72rem;">TOTAL ASISTENTES</small>
                                    <span class="fs-4 fw-bold text-primary" id="totalAsistentesCalculado">0</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-body p-0">
                            <form id="formGuardarAsistencias">
                                <div class="puestos-container">
                                    ${puestos.map((p, idx) => `
                                        <div class="puesto-row p-3 border-bottom ${!p.editable ? 'bg-light-subtle opacity-75' : (idx % 2 === 0 ? 'bg-white' : 'bg-light-subtle')}">
                                            <div class="row g-2 align-items-center">
                                                <div class="col-12 col-md-5">
                                                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-1">
                                                        <div class="d-flex align-items-center gap-2">
                                                            <span class="fw-bold text-dark fs-6">${p.puesto_nombre}</span>
                                                            ${p.aplica_turnos ? `
                                                                <span class="badge bg-${p.turno_badge}-subtle text-dark border border-${p.turno_badge}-subtle" style="font-size: 0.72rem;">
                                                                    ${p.turno_icon ? `<i class="bi bi-${p.turno_icon}-fill text-${p.turno_badge} me-1"></i>` : ''}
                                                                    ${p.turno_label}
                                                                </span>
                                                            ` : ''}
                                                        </div>
                                                        <span class="badge-status-puesto">
                                                            ${p.guardado ? `
                                                                <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1" style="font-size: 0.72rem;">
                                                                    <i class="bi bi-check-circle-fill me-1"></i> Registrado (${p.cantidad_asistentes})
                                                                </span>
                                                            ` : `
                                                                <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1" style="font-size: 0.72rem;">
                                                                    <i class="bi bi-clock me-1"></i> Pendiente
                                                                </span>
                                                            `}
                                                        </span>
                                                    </div>
                                                    ${p.puesto_descripcion ? `<small class="text-muted d-block mt-1" style="font-size: 0.75rem;">${p.puesto_descripcion}</small>` : ''}
                                                    ${p.registrado_por ? `
                                                        <small class="text-muted d-block" style="font-size: 0.7rem;">
                                                            <i class="bi bi-person me-1"></i> Por: ${p.registrado_por}
                                                        </small>
                                                    ` : ''}
                                                </div>

                                                <!-- Input de Cantidad -->
                                                <div class="col-6 col-md-3">
                                                    <label class="form-label text-muted small d-md-none mb-1">Cantidad de Personas:</label>
                                                    <div class="input-group">
                                                        <span class="input-group-text bg-light text-muted">
                                                            <i class="bi bi-people"></i>
                                                        </span>
                                                        <input type="number" 
                                                               class="form-control input-cantidad fw-bold text-center fs-5 ${!p.editable ? 'bg-light text-muted' : ''}" 
                                                               data-puesto-id="${p.id_puesto}"
                                                               data-turno="${p.turno}"
                                                               value="${(p.cantidad_asistentes !== '' && p.cantidad_asistentes !== null && p.cantidad_asistentes !== undefined) ? p.cantidad_asistentes : ''}" 
                                                               min="0" 
                                                               max="500" 
                                                               step="1"
                                                               placeholder=""
                                                               ${!p.editable ? 'readonly' : ''}>
                                                    </div>
                                                </div>

                                                <!-- Input de Observaciones -->
                                                <div class="col-6 col-md-4">
                                                    <label class="form-label text-muted small d-md-none mb-1">Notas / Observaciones:</label>
                                                    <input type="text" 
                                                           class="form-control form-control-sm text-secondary input-observaciones ${!p.editable ? 'bg-light' : ''}" 
                                                           data-puesto-id="${p.id_puesto}"
                                                           data-turno="${p.turno}"
                                                           value="${p.observaciones || ''}" 
                                                           placeholder="Observación opcional..." 
                                                           maxlength="500"
                                                           ${!p.editable ? 'readonly' : ''}>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="card-footer bg-white p-3 p-md-4 border-top d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                                    <div class="text-muted small">
                                        <i class="bi bi-info-circle me-1 text-primary"></i> 
                                        Ingresa la cantidad de personas asistentes. Deja en blanco los puestos que registrarás más tarde.
                                    </div>
                                    <div class="d-flex gap-2 w-100 w-sm-auto justify-content-end">
                                        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" id="btnGuardar">
                                            <i class="bi bi-save-fill"></i>
                                            <span id="btnGuardarText">Guardar Asistencia</span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                `;

                // Recalcular total en tiempo real
                const inputsCantidad = captureContainer.querySelectorAll('.input-cantidad');
                const totalDisplay = document.getElementById('totalAsistentesCalculado');

                function recalcular() {
                    let sum = 0;
                    inputsCantidad.forEach(inp => {
                        const val = parseInt(inp.value, 10);
                        if (!isNaN(val) && val > 0) sum += val;
                    });
                    if (totalDisplay) totalDisplay.textContent = sum;
                }

                inputsCantidad.forEach(inp => inp.addEventListener('input', recalcular));
                recalcular();

                // Enviar formulario
                const formGuardar = document.getElementById('formGuardarAsistencias');
                formGuardar.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const btnGuardar = document.getElementById('btnGuardar');
                    const btnGuardarText = document.getElementById('btnGuardarText');

                    btnGuardar.disabled = true;
                    btnGuardarText.textContent = 'Guardando...';

                    const items = [];
                    inputsCantidad.forEach(inp => {
                        // Si el usuario no es admin y el puesto ya está registrado/bloqueado, omitir
                        if (inp.readOnly && !data.isAdmin) return;

                        const idPuesto = parseInt(inp.getAttribute('data-puesto-id'), 10);
                        const turno = inp.getAttribute('data-turno');
                        const rawVal = inp.value.trim();
                        if (rawVal !== '') {
                            const obsInp = captureContainer.querySelector(`.input-observaciones[data-puesto-id="${idPuesto}"][data-turno="${turno}"]`);
                            items.push({
                                id_puesto: idPuesto,
                                turno: turno,
                                cantidad: parseInt(rawVal, 10),
                                observaciones: obsInp ? obsInp.value.trim() : ''
                            });
                        }
                    });

                    if (items.length === 0) {
                        Swal.fire({
                            title: 'Sin datos',
                            text: 'No has ingresado cantidad de asistentes para ningún puesto.',
                            icon: 'info'
                        });
                        btnGuardar.disabled = false;
                        btnGuardarText.textContent = 'Guardar Asistencia';
                        return;
                    }

                    try {
                        const payload = {
                            fecha: data.selectedDate,
                            id_area: data.selectedAreaId,
                            id_ubicacion: data.selectedUbicacionId || null,
                            items: items
                        };

                        const res = await api.post('/asistencias/guardar', payload);
                        if (res.success) {
                            Swal.fire({
                                title: '¡Guardado!',
                                text: res.message || 'Asistencias guardadas exitosamente.',
                                icon: 'success',
                                confirmButtonColor: '#860063'
                            });
                            // Recargar jornada para ver el bloqueo y estado actualizado
                            await loadJornadaData();
                        } else {
                            throw new Error(res.message || 'Error al guardar');
                        }
                    } catch (err) {
                        Swal.fire({
                            title: 'Error',
                            text: err.message || 'No se pudieron guardar las asistencias.',
                            icon: 'error',
                            confirmButtonColor: '#D83548'
                        });
                        btnGuardar.disabled = false;
                        btnGuardarText.textContent = 'Guardar Asistencia';
                    }
                });
            }

            // Cambios de selección
            selectArea.addEventListener('change', () => {
                currentAreaId = selectArea.value ? parseInt(selectArea.value, 10) : null;
                currentUbicacionId = null;
                loadJornadaData();
            });

            selectUbicacion.addEventListener('change', () => {
                currentUbicacionId = selectUbicacion.value ? parseInt(selectUbicacion.value, 10) : null;
                loadJornadaData();
            });

            btnCargarJornada.addEventListener('click', () => {
                loadJornadaData();
            });

            // Cargar inicial
            loadJornadaData();
        });
    </script>
</body>
</html>
